actions:
  apisListed: 1
  openapiHarvested: false
  specsHarvested: 0
  mcpArtifactsHarvested: 2
  artifacts:
  - mcp/view-com-au-mcp-tools.json
  - mcp/view-com-au-mcp-initialize.json
  reason: >-
    No OpenAPI, Swagger, AsyncAPI or OData $metadata document exists anywhere on
    a reachable View.com.au host, so openapi/ was not created. The two MCP
    documents are the only machine-readable contracts View.com.au publishes, and
    both were harvested verbatim from live anonymous JSON-RPC responses. No spec
    was generated, inferred or reconstructed.
