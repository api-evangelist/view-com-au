apis:
- aid: view-com-au:view-com-au-property-mcp-server
  name: View.com.au Property MCP Server
  description: >-
    A publicly reachable, unauthenticated Model Context Protocol server
    (streamable HTTP, serverInfo name "view-com-au-mcp-server" version 1.0.0,
    protocol 2024-11-05) exposing three tools over View.com.au's Australian
    property data. propertySearch returns on-market listings by
    state/city/suburb/postcode/street/LGA/school or lat-long radius, filtered by
    property type, price, beds, baths, car spaces, land size, features and sale
    method. propertyDetail returns a single on-market listing by listingId,
    including inspection times, floor plans, Statement of Information, nearby
    schools, zoning, agency and agent. offMarketPropertyDetail returns an
    off-market property by SEO slug, including price estimates, zoning code and
    planning overlays, property history and images. Verified live on 2026-07-26
    by anonymous JSON-RPC initialize, tools/list and a tools/call to
    propertySearch that returned real Fitzroy VIC listings — no API key, no
    signup, no agreement. Rate limited at 100 requests per 300 seconds. No
    human-readable documentation page for this server was found.
  humanURL: https://view.com.au/
  baseURL: https://mcp.view.com.au/mcp
