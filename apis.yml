name: View.com.au
kind: company
description: >-
  View.com.au is an Australian residential property portal operated by View Media
  Group Pty Ltd (ACN 619 657 680) through view.com.au Pty Ltd (ACN 088 369 395),
  based in Victoria. It is the challenger portal to the REA Group / Domain
  duopoly, carrying for-sale, for-rent and sold listings, agency and agent
  profiles, Victorian sales and auction results, off-market "Property 360"
  property records with price estimates and planning/zoning overlays, plus home
  loans and editorial. Its API posture is unusual and worth stating precisely.
  The company publishes no developer portal, no OpenAPI, and no self-serve API
  program, and every HTML page on view.com.au sits behind DataDome bot protection
  that returns HTTP 403 to non-browser clients — yet it operates a completely
  public, unauthenticated Model Context Protocol server at
  https://mcp.view.com.au/mcp that returns live listing data to any anonymous
  agent. The human web is closed to machines while the agent surface is wide
  open. RESO plays no part here. RESO is a US National Association of REALTORS
  construct, and the RESO certified-organizations directory lists no Australian
  organizations at all.
